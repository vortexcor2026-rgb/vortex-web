[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/marketing-digital"
  to = "/marketing-digital/index.html"
  status = 200

[[redirects]]
  from = "/gestion-de-personas"
  to = "/gestion-de-personas/index.html"
  status = 200

[[redirects]]
  from = "/seleccion-de-talentos"
  to = "/seleccion-de-talentos/index.html"
  status = 200

[[redirects]]
  from = "/diagnostico-apex"
  to = "/diagnostico-apex/index.html"
  status = 200

[[redirects]]
  from = "/digital-marketing"
  to = "/digital-marketing/index.html"
  status = 200

[[redirects]]
  from = "/talent-selection"
  to = "/talent-selection/index.html"
  status = 200

[[redirects]]
  from = "/people-management"
  to = "/people-management/index.html"
  status = 200

[[redirects]]
  from = "/apex-diagnostic"
  to = "/apex-diagnostic/index.html"
  status = 200


# Old .html payment pages keep working; www and http are handled by Netlify
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[functions]
  included_files = ["vortex-catalog.js"]
